<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 534" width="1200" height="534" role="img" aria-labelledby="lst lsd" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
<title id="lst">Live service estate: nine public services, each measured directly</title>
<desc id="lsd">Nine public services with HTTP status, response time and payload size, each fetched directly on 2026-09-08. All nine return HTTP 200 with a full page. Response times range from 60 to 464 milliseconds. Payload sizes range from 8,243 to 166,396 bytes. Bar length encodes response time relative to the slowest. Colour marks the three tiers: featured work, everyday tools, and also-built. Payload is listed because a live host can still return an empty stub, so a 200 alone proves nothing. These are single measurements from one location, not uptime averages.</desc>
