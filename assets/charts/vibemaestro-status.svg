<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 526" width="1200" height="526" role="img" aria-labelledby="vst vsd" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
<title id="vst">VibeMaestro live status: eight monitored services, all operational</title>
<desc id="vsd">Mini status board for VibeMaestro, read from its own public status API at status.vibemaestro.app on 2026-09-08. Eight of eight services operational. Website, App and Studio API, AI Gateway, Tier Gate, Data and SDK Backend, Preview, Publish, and Discord Bot. Response times range from 19 to 35 milliseconds. Preview answers 400 because it requires parameters and Publish answers 401 because it requires auth; both codes prove the service is responding, so the status worker correctly counts them operational. Bar length encodes response time relative to the slowest. A snapshot, not a live embed: the live page is linked in the README.</desc>
<rect width="1200" height="526" fill="#0B1015"/>
<text x="56" y="50" fill="#F3F7F9" font-size="25" font-weight="600">VibeMaestro is up, and it says so publicly</text>
