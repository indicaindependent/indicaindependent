oke-width="1.2" opacity="0.55"/><rect x="830" y="402" width="14.9" height="12" fill="none" stroke="#A7B6C2" stroke-width="1.2"/><rect x="40" y="440" width="900" height="56" rx="8" fill="none" stroke="#33424F" stroke-width="1"/><text x="56" y="466" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#FB7185" font-weight="700" text-anchor="start" letter-spacing="0">THE THREE SECURITY WORKER NAMES ARE WITHHELD ON PURPOSE</text><text x="56" y="486" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#A7B6C2" font-weight="400" text-anchor="start" letter-spacing="0">Counting them is honest; naming them hands over a map. Publish the architecture, withhold the calibration.</text></svg>